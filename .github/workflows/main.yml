name: RDP - Gaming Edition

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          
          # For testing, allow any incoming connection on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # (Optional) Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create RDP User, Auto-Logon and Disable Sleep/Lock
        run: |
          # Đặt mật khẩu mới theo yêu cầu của bạn
          $password = "RI7a11032012"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          # 1. Cấu hình Windows tự động đăng nhập cho User RDP (Vào thẳng Desktop không hỏi pass)
          $RegistryPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon"
          Set-ItemProperty -Path $RegistryPath -Name "AutoAdminLogon" -Value "1" -Force
          Set-ItemProperty -Path $RegistryPath -Name "DefaultUserName" -Value "RDP" -Force
          Set-ItemProperty -Path $RegistryPath -Name "DefaultPassword" -Value $password -Force
          
          # 2. Vô hiệu hóa Screen Saver (Màn hình chờ) và Khóa màn hình khi rảnh
          $ControlPanelPath = "HKCU:\Control Panel\Desktop"
          Set-ItemProperty -Path $ControlPanelPath -Name "ScreenSaveActive" -Value "0" -Force
          Set-ItemProperty -Path $ControlPanelPath -Name "ScreenSaverIsSecure" -Value "0" -Force
          Set-ItemProperty -Path $ControlPanelPath -Name "ScreenTimeOutValue" -Value "0" -Force
          
          # 3. Tắt tính năng Sleep / Turn off screen bằng powercfg
          powercfg /change monitor-timeout-ac 0
          powercfg /change monitor-timeout-dc 0
          powercfg /change disk-timeout-ac 0
          powercfg /change disk-timeout-dc 0
          powercfg /change standby-timeout-ac 0
          powercfg /change standby-timeout-dc 0
          powercfg /change hibernate-timeout-ac 0
          powercfg /change hibernate-timeout-dc 0
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Optimize System for Gaming & Performance
        run: |
          # 1. Bật chế độ tối ưu hóa hiệu năng tối đa (Ultimate Performance)
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c

          # 2. Bật dịch vụ Âm thanh (Cần thiết cho một số game để không bị crash khi mở)
          Set-Service -Name "Audiosrv" -StartupType Automatic
          Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue

          # 3. Tăng tốc đồ họa phần cứng qua Registry (Mở khóa DirectX / Giảm lag RDP)
          $RdpKey = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (-not (Test-Path $RdpKey)) { New-Item -Path $RdpKey -Force }
          Set-ItemProperty -Path $RdpKey -Name "bUseHardwareGraphicsAdapter" -Value 1 -Force
          Set-ItemProperty -Path $RdpKey -Name "GetGraphicsCaptureDisabled" -Value 0 -Force
          
          # 4. Tắt hiệu ứng hoạt họa Windows để máy chạy mượt hơn nữa
          $VisualKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
          if (-not (Test-Path $VisualKey)) { New-Item -Path $VisualKey -Force }
          Set-ItemProperty -Path $VisualKey -Name "VisualFXSetting" -Value 2 -Force

      - name: Install Tailscale via Chocolatey
        run: |
          Write-Host "Đang cài đặt Tailscale chính thức qua choco..."
          # Choco đã được cài sẵn trên GitHub Actions Runner nên lệnh này chạy trực tiếp cực kỳ ổn định
          choco install tailscale -y --no-progress
          Write-Host "Cài đặt Tailscale hoàn tất!"

      - name: Establish Tailscale Connection
        run: |
          # Định vị file cài đặt chuẩn sau khi chạy qua Chocolatey
          $tailscaleExe = Join-Path -Path $env:ProgramFiles -ChildPath "Tailscale\tailscale.exe"

          # Chờ tối đa 30 giây đề phòng dịch vụ nền khởi động chậm
          $timeout = 0
          while (-not (Test-Path $tailscaleExe) -and $timeout -lt 6) {
              Start-Sleep -Seconds 5
              $timeout++
          }

          if (-not (Test-Path $tailscaleExe)) {
              Write-Error "Không tìm thấy file tailscale.exe tại vị trí mặc định."
              exit 1
          }

          Write-Host "Tìm thấy Tailscale tại: $tailscaleExe"

          # Khởi chạy Tailscale kết nối với Auth Key lấy từ Secrets
          & $tailscaleExe up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          # Đợi cấp phát IP Tailscale 
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tailscaleExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          # Test connectivity bằng Test-NetConnection
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: RI7a11032012"
          Write-Host "==================`n"
          
          # Giữ máy ảo hoạt động liên tục
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
